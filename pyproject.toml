[project]
name = "gesaku"
version = "0.1.0"
description = "Autonomous novel pipeline + operator console (gesaku)"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "loguru>=0.7.3",
    "pydantic>=2.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
gesaku = "cli:main"

[dependency-groups]
dev = ["ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Application-style flat layout: ship cli.py so `uv run gesaku` works from the repo.
# Runtime data (webui/, prompts/, core/) is resolved from the checkout, not the wheel.
only-include = ["cli.py"]

[tool.hatch.build.targets.sdist]
only-include = [
  "cli.py",
  "pyproject.toml",
  "README.md",
  "LICENSE",
]

